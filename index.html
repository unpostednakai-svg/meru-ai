<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>める専用 Xポスト作成AI</title>

<style>
body{font-family:sans-serif;background:#fdf6f0;margin:0}
.tabs{display:flex}
.tab{flex:1;padding:10px;border:none;cursor:pointer}
.tab.active{background:#c4706b;color:#fff}
.tab-panel{display:none;padding:20px}
.tab-panel.active{display:block}
</style>
</head>

<body>

<div class="tabs">
  <button class="tab active" data-tab="create">作成</button>
  <button class="tab" data-tab="today">今日</button>
  <button class="tab" data-tab="history">履歴</button>
</div>

<div id="panel-create" class="tab-panel active">
  <h2>投稿生成</h2>
  <button id="genBtn">生成</button>
  <div id="output"></div>
</div>

<div id="panel-today" class="tab-panel">
  <h2>今日のタスク</h2>
  <button id="makeTask">タスク生成</button>
  <div id="taskList"></div>
</div>

<div id="panel-history" class="tab-panel">
  <h2>履歴</h2>
  <div id="historyList"></div>
</div>

<script>
// ===== タブ切り替え（完全安定版）=====
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));

    btn.classList.add("active");
    document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
  });
});

// ===== 投稿生成（ダミー）=====
document.getElementById("genBtn").addEventListener("click", ()=>{
  const text = "これは生成された投稿です✨";
  document.getElementById("output").innerText = text;

  saveHistory(text);
});

// ===== 履歴保存 =====
let history = JSON.parse(localStorage.getItem("hist") || "[]");

function saveHistory(text){
  history.unshift({text, date:new Date().toLocaleString()});
  localStorage.setItem("hist", JSON.stringify(history));
  renderHistory();
}

// ===== 履歴表示 =====
function renderHistory(){
  const el = document.getElementById("historyList");
  if(!history.length){
    el.innerHTML = "履歴なし";
    return;
  }

  el.innerHTML = history.map(h=>{
    return `<div style="margin-bottom:10px">
      <div>${h.text}</div>
      <small>${h.date}</small>
    </div>`;
  }).join("");
}
renderHistory();

// ===== 今日タスク =====
let tasks = [];

document.getElementById("makeTask").addEventListener("click", ()=>{
  tasks = [
    {id:1, text:"投稿する"},
    {id:2, text:"リプする"},
    {id:3, text:"分析する"}
  ];
  renderTasks();
});

function renderTasks(){
  const el = document.getElementById("taskList");

  el.innerHTML = tasks.map(t=>{
    return `<div data-id="${t.id}" style="padding:10px;border-bottom:1px solid #ddd;cursor:pointer">
      ${t.text}
    </div>`;
  }).join("");

  // ← ここ重要（イベントは後付け）
  document.querySelectorAll("#taskList div").forEach(div=>{
    div.addEventListener("click", ()=>{
      toggleTask(div.dataset.id);
    });
  });
}

function toggleTask(id){
  alert("タスククリック: " + id);
}
</script>

</body>
</html>
